version: '3'
services:
  nginx:
    container_name: nginx
    image: nginx:1.22
    restart: always
    ports:
      - 80:80
    volumes:
      - ./conf.d/:/etc/nginx/conf.d/
      - ./www/:/var/www/
      - ./log/:/var/log/nginx/

  nginx-export:
    container_name: nginx-export
    image: nginx/nginx-prometheus-exporter
    restart: always
    command:
      - '--nginx.scrape-uri=http://nginx/status'
    ports:
      - 9113:9113
    links:
      - nginx

