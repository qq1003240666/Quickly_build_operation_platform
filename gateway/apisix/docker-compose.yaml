version: "3"
services:
  apisix:
    container_name: apisix
    image: apache/apisix
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./apisix_data/lua:/usr/local/apisix/lua/
    ports:
      - "9080:9080"
      - "9180:9180"
    links:
      - apisix-etcd

  apisix-etcd:
    container_name: apisix-etcd
    image: quay.io/coreos/etcd:v3.5.5
    restart: always
    command:
      /usr/local/bin/etcd --name etcd0 --advertise-client-urls http://0.0.0.0:2379 --listen-client-urls http://0.0.0.0:2379 --listen-peer-urls http://0.0.0.0:2380
    volumes:
      - ./apisix_etcd_data/etcd-data:/etcd-data

  apisix-dashboard:
    container_name: apisix-dashboard
    image: apache/apisix-dashboard:3.0.0-alpine
    restart: always
    volumes:
    - ./apisix_dashboard_conf/dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml
    ports:
    - "9000:9000"
    depends_on:
      - apisix-etcd
